################################################################################
# KNOWN ISSUES / NOT YET DEFINED
#
# 1. DOUBLE-PREFIXED RECORDS. Records from the Raspberry Pi ports (531xx)
#    already carry "<logger_id><TAB><timestamp><TAB>" ahead of the payload.
#    When OpenRVDAS also prefixes the record, the parser is handed:
#
#      gyro_2  2026-...Z  gyro_mgc_2  2026-...Z  $MGTHS,287.75,A*15
#
#    and no format will match, because the field string starts with the
#    sensor's own id rather than the sentence. Note also that the inner id
#    does not always equal the OpenRVDAS logger name - the logger is
#    'gyro_2' but the sensor writes 'gyro_mgc_2'.
#
#    Fix this in the logger config, not here: either read from the LDS ports
#    (541xx), which are not double-prefixed, or strip the inner prefix with a
#    RegexReplaceTransform ahead of ParseTransform. Defining the prefix away
#    in this file would bake a transport quirk into the device definitions.
#
# 2. HYPHENATED DATA IDS CANNOT BE PARSED. The default record_format is
#
#      {data_id:w} {timestamp:ti} {field_string}
#
#    and ':w' matches word characters only - letters, digits and underscore,
#    but NOT hyphens. So 'ssv-aml-cb' and 'thermo_pyrometer-ct15' fail before
#    any device definition is consulted, producing:
#
#      Unable to parse record into "{data_id:w} {timestamp:ti} {field_string}"
#
#    Two ways out: rename those loggers to use underscores (both spellings are
#    defined above, so nothing here needs to change), or pass an explicit
#    record_format to ParseTransform whose data_id field tolerates hyphens,
#    e.g. "{data_id:nc} {timestamp:ti} {field_string}". Renaming is simpler
#    and keeps the ids consistent with the rest of the cruise definition.
#
# 3. ctd_sea_bird, met_met4a_scr, tsg_emssv, wave_wamos and mb_em2042 are
#    listed on the ship's datagram page but had no sample output available,
#    so they are deliberately not defined here rather than guessed at.
