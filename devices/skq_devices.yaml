  # [PROVISIONAL] Aanderaa Optode 4330, raw output.
  #   4330 3594 222.949 100.855 22.736 28.536 29.136 36.328 7.192 968.1 843.7 155.3
  SKQ_Optode4330:
    category: "device_type"
    description: "Aanderaa Optode 4330 dissolved oxygen sensor"
    format: "{ModelNumber:d}\t{SerialNumber:d}\t{O2Concentration:og}\t{AirSaturation:og}\t{Temp:og}\t{CalPhase:og}\t{TCPhase:og}\t{C1RPh:og}\t{C2RPh:og}\t{C1Amp:og}\t{C2Amp:og}\t{RawTemp:og}"
    fields:
      ModelNumber:
        description: "Instrument model number"
      SerialNumber:
        description: "Instrument serial number"
      O2Concentration:
        units: "uMol/L"
        description: "Dissolved oxygen concentration"
      AirSaturation:
        units: "percent"
        description: "Oxygen air saturation"
      Temp:
        units: "deg C"
        description: "Optode temperature"
      CalPhase:
        units: "degrees"
        description: "Calibrated phase"
      TCPhase:
        units: "degrees"
        description: "Temperature-compensated phase"
      C1RPh:
        units: "degrees"
        description: "Phase, blue excitation"
      C2RPh:
        units: "degrees"
        description: "Phase, red excitation"
      C1Amp:
        description: "Amplitude, blue excitation"
      C2Amp:
        description: "Amplitude, red excitation"
      RawTemp:
        description: "Raw temperature counts"

  # [PROVISIONAL] Salinity-corrected optode product stream.
  SKQ_Optode4330_Cor:
    category: "device_type"
    description: "Salinity-corrected oxygen from Optode 4330"
    format: "{ModelNumber:d},{SerialNumber:d},{O2Corrected:og},{O2Raw:og},{AirSaturation:og},{Offset1:og},{Offset2:og},{Offset3:og},{Salinity:og},{Latitude:og},{Longitude:og}"
    fields:
      ModelNumber:
        description: "Instrument model number"
      SerialNumber:
        description: "Instrument serial number"
      O2Corrected:
        units: "uMol/L"
        description: "Salinity-corrected dissolved oxygen"
      O2Raw:
        units: "uMol/L"
        description: "Uncorrected dissolved oxygen"
      AirSaturation:
        units: "percent"
        description: "Oxygen air saturation"
      Offset1:
        description: "Correction term 1 - unconfirmed"
      Offset2:
        description: "Correction term 2 - unconfirmed"
      Offset3:
        description: "Correction term 3 - unconfirmed"
      Salinity:
        units: "PSU"
        description: "Salinity used for correction"
      Latitude:
        units: "degrees north"
        description: "Latitude used for correction"
      Longitude:
        units: "degrees east"
        description: "Longitude used for correction"

