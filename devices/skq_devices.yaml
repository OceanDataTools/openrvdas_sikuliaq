  SKQ_RainORG815:
    category: "device_type"
    description: "Optical Scientific ORG-815-DS optical rain gauge"
    format: "R{RainFlag:w} {RainRate:og} {RainAccumulation:og} {RainStatus:w}*{Checksum:w} {Scintillation:od} {OpticalPower:od} {Extinction:od} {Temp:og}"
