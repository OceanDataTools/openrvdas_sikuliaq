################################################################################
# Device and device_type definitions for R/V Sikuliaq
#
# Point a cruise definition at this file with, e.g.
#
#   variables:
#     parse_definition_path: local/sikuliaq/devices/skq_devices.yaml
#
# Sensor inventory, ports and sample records are from the ship's datagram map:
#   https://web.sikuliaq.alaska.edu/underway-data/underway-sensor-datagrams
#
# NOTE ON RECORD SHAPE
# --------------------
# Sensors served by a Raspberry Pi (the 531xx ports) prepend their own logger
# id and timestamp to the payload, tab-separated:
#
#   wind_mast_port<TAB>2026-08-23T22:14:09.4143Z<TAB>$WIMWV,282,R,21.0,N,A*06
#
# If the OpenRVDAS reader also prefixes the record, the parser sees the id
# twice and the inner copy lands in the field string. Sensors taken straight
# from the LDS ports (541xx) or direct from the sensor do NOT have this
# prefix. See "KNOWN ISSUES" at the bottom of this file.
#
# FIELD DEFINITION CONFIDENCE
# ---------------------------
# Definitions below are marked:
#   [NMEA]        standard sentence; field meanings are from the NMEA 0183 spec
#   [VERIFIED]    matched against real Sikuliaq records
#   [PROVISIONAL] record *shape* is correct and will parse, but the meaning of
#                 individual fields is inferred. Confirm against the ship's
#                 cruisedata:\SKQxxxx\lds\docs\format_descriptions_SKQ202x.txt
#                 before trusting these values scientifically.
################################################################################

includes:
  # Stock device_types: AIS, Garmin02/19, Knudsen3260, Seapath200/330/380,
  # TrimbleGPS, ADCP_OS75, Gravimeter_BGM3, Gyrocompass, MultibeamEM122,
  # PCO2_LDEO, PGUV, SBE38, SBE48, SVP, TSG_SBE45, Winch
  - contrib/devices/*.yaml

################################################################################
device_types:

  ##############################################################################
  # WIND
  ##############################################################################

  # [NMEA] Relative (apparent) wind. $WIMWV
  SKQ_WindRelative:
    category: "device_type"
    description: "Relative wind speed/angle, NMEA MWV"
    format:
      MWV: "${:2l}MWV,{WindAngle:g},{Reference:w},{WindSpeed:g},{WindSpeedUnits:w},{Status:w}*{Checksum:x}"
    fields:
      WindAngle:
        units: "degrees"
        description: "Wind angle, 0-359, relative to bow (R) or true (T)"
      Reference:
        description: "R = relative, T = true"
      WindSpeed:
        description: "Wind speed, units given by WindSpeedUnits"
      WindSpeedUnits:
        description: "K = km/h, M = m/s, N = knots, S = statute mph"
      Status:
        description: "A = valid, V = invalid"

  # [NMEA] True wind direction and speed. $WIMWD
  # The magnetic-direction field is routinely empty on Sikuliaq, hence 'og'.
  SKQ_WindTrue:
    category: "device_type"
    description: "True wind direction/speed, NMEA MWD"
    format:
      MWD: "${:2l}MWD,{WindDirTrue:og},T,{WindDirMag:og},M,{WindSpeedKt:og},N,{WindSpeedMs:og},M*{Checksum:x}"
    fields:
      WindDirTrue:
        units: "degrees"
        description: "Wind direction, degrees true"
      WindDirMag:
        units: "degrees"
        description: "Wind direction, degrees magnetic (often empty)"
      WindSpeedKt:
        units: "knots"
        description: "Wind speed in knots"
      WindSpeedMs:
        units: "m/s"
        description: "Wind speed in meters/second"

  # [VERIFIED] Gill ultrasonic anemometer, polled mode.
  # The sensor wraps its payload in STX/ETX control characters, but they are
  # stripped by the time the record reaches the parser, so the format matches
  # the bare comma-separated form seen on the wire:
  #   A,304,011.26,M,60,0B
  SKQ_WindGill:
    category: "device_type"
    description: "Gill ultrasonic wind sensor, relative output"
    format:
      GILL: "{Status:w},{WindAngle:g},{WindSpeed:g},{WindSpeedUnits:w},{Quality:od},{Checksum:w}"
    fields:
      Status:
        description: "Sensor status code"
      WindAngle:
        units: "degrees"
        description: "Relative wind angle"
      WindSpeed:
        description: "Wind speed, units given by WindSpeedUnits"
      WindSpeedUnits:
        description: "M = m/s"
      Quality:
        description: "Reported data quality"

  # [PROVISIONAL] Metek uSonic-3 Omni 3D sonic anemometer.
  #   M:x =   944 y =  -631 z =    40 t =  1667 dq=   100
  # x/y/z are orthogonal wind components and t is sonic temperature, both in
  # hundredths of the base unit on this instrument family; dq is a percentage
  # data-quality figure. Scaling is NOT applied here - values are parsed raw.
  SKQ_MetekUSonic:
    category: "device_type"
    description: "Metek uSonic-3 Omni 3D ultrasonic anemometer"
    # Values are space-padded to a fixed width, so each field is declared
    # right-aligned (':>') to absorb the leading whitespace.
    format:
      METEK: "M:x ={WindX:>g} y ={WindY:>g} z ={WindZ:>g} t ={SonicTemp:>g} dq={DataQuality:>g}"
    fields:
      WindX:
        description: "Wind component, x axis (raw counts; typically cm/s)"
      WindY:
        description: "Wind component, y axis (raw counts; typically cm/s)"
      WindZ:
        description: "Wind component, z axis (raw counts; typically cm/s)"
      SonicTemp:
        description: "Sonic temperature (raw counts; typically 0.01 degC)"
      DataQuality:
        units: "percent"
        description: "Data quality indicator, 0-100"

  ##############################################################################
  # HEADING / ATTITUDE
  ##############################################################################

  # [NMEA] MGC-series gyrocompass. Sikuliaq's gyros emit the $MG.. talker,
  # which the stock 'Gyrocompass' device_type does not match (it hardcodes
  # $HEHDT/$HEROT). PSXN,20 and PSXN,23 are Seapath-proprietary attitude
  # sentences also emitted by these units.
  SKQ_GyroMGC:
    category: "device_type"
    description: "MGC R3 gyrocompass (gyro_1, gyro_2)"
    format:
      HDT: "${:2l}HDT,{HeadingTrue:g},T*{Checksum:x}"
      THS: "${:2l}THS,{HeadingTrue:g},{ModeIndicator:w}*{Checksum:x}"
      ROT: "${:2l}ROT,{RateOfTurn:g},{Status:w}*{Checksum:x}"
      HCR: "${:2l}HCR,{HeadingTrue:g},{Status:w},{CorrectionStatus:w},{Deviation:og}*{Checksum:x}"
      PSXN20: "$PSXN,20,{HorizQual:d},{HeightQual:d},{HeadingQual:d},{RollPitchQual:d}*{Checksum:x}"
      PSXN23: "$PSXN,23,{Roll:og},{Pitch:og},{HeadingTrue:og},{Heave:og}*{Checksum:x}"
    fields:
      HeadingTrue:
        units: "degrees"
        description: "True heading"
      ModeIndicator:
        description: "A = autonomous, E = estimated, M = manual, V = invalid"
      RateOfTurn:
        units: "degrees/minute"
        description: "Rate of turn, negative = bow to port"
      Status:
        description: "A = valid, V = invalid"
      CorrectionStatus:
        description: "Correction applied status (MGHCR)"
      Deviation:
        units: "degrees"
        description: "Heading deviation/correction (MGHCR)"
      HorizQual:
        description: "Horizontal position quality, 0-3"
      HeightQual:
        description: "Height quality, 0-3"
      HeadingQual:
        description: "Heading quality, 0-3"
      RollPitchQual:
        description: "Roll/pitch quality, 0-3"
      Roll:
        units: "degrees"
        description: "Roll, positive = port side up"
      Pitch:
        units: "degrees"
        description: "Pitch, positive = bow up"
      Heave:
        units: "meters"
        description: "Heave, positive = up"

  ##############################################################################
  # POSITION
  ##############################################################################

  # [NMEA] Generic GNSS receiver. Covers gnss_cnav (CNAV) and gnss_mps865
  # (Trimble MPS865). The ${:2l} talker wildcard matches $GP.., $GN.. etc.
  SKQ_GNSS:
    category: "device_type"
    description: "GNSS receiver - GGA/GLL/RMC/VTG/ZDA/HDT"
    format:
      GGA: "${:2l}GGA,{GPSTime:f},{Latitude:nlat},{NorS:w},{Longitude:nlat},{EorW:w},{FixQuality:d},{NumSats:d},{HDOP:of},{AntennaHeight:of},M,{GeoidHeight:of},M,{LastDGPSUpdate:of},{DGPSStationID:os}*{Checksum:x}"
      GLL: "${:2l}GLL,{Latitude:nlat},{NorS:w},{Longitude:nlat},{EorW:w},{GPSTime:f},{Status:w},{Mode:ow}*{Checksum:x}"
      # Two RMC variants are on the wire: gnss_cnav sends NMEA 4.1 with a
      # trailing NavStatus field, ins_seapath_position sends the older form
      # that ends at the mode indicator.
      RMC: "${:2l}RMC,{GPSTime:f},{Status:w},{Latitude:nlat},{NorS:w},{Longitude:nlat},{EorW:w},{SpeedKt:og},{CourseTrue:og},{GPSDate:w},{MagVar:og},{MagVarEorW:ow},{Mode:ow},{NavStatus:ow}*{Checksum:x}"
      RMC_no_navstatus: "${:2l}RMC,{GPSTime:f},{Status:w},{Latitude:nlat},{NorS:w},{Longitude:nlat},{EorW:w},{SpeedKt:og},{CourseTrue:og},{GPSDate:w},{MagVar:og},{MagVarEorW:ow},{Mode:ow}*{Checksum:x}"
      VTG: "${:2l}VTG,{CourseTrue:og},T,{CourseMag:og},M,{SpeedKt:og},N,{SpeedKm:og},K,{Mode:ow}*{Checksum:x}"
      ZDA: "${:2l}ZDA,{GPSTime:f},{GPSDay:d},{GPSMonth:d},{GPSYear:d},{LocalHours:od},{LocalZone:od}*{Checksum:x}"
      HDT: "${:2l}HDT,{HeadingTrue:g},T*{Checksum:x}"
      # Seapath-proprietary attitude, also emitted by ins_seapath_position.
      PSXN20: "$PSXN,20,{HorizQual:d},{HeightQual:d},{HeadingQual:d},{RollPitchQual:d}*{Checksum:x}"
      PSXN23: "$PSXN,23,{Roll:og},{Pitch:og},{HeadingTrue:og},{Heave:og}*{Checksum:x}"
    fields:
      HorizQual:
        description: "Horizontal position quality, 0-3"
      HeightQual:
        description: "Height quality, 0-3"
      HeadingQual:
        description: "Heading quality, 0-3"
      RollPitchQual:
        description: "Roll/pitch quality, 0-3"
      Roll:
        units: "degrees"
        description: "Roll, positive = port side up"
      Pitch:
        units: "degrees"
        description: "Pitch, positive = bow up"
      Heave:
        units: "meters"
        description: "Heave, positive = up"
      GPSTime:
        description: "UTC time as HHMMSS.ss"
      GPSDate:
        description: "UTC date as DDMMYY"
      Latitude:
        units: "degrees north"
        description: "Latitude, decimal degrees"
      NorS:
        description: "N or S"
      Longitude:
        units: "degrees east"
        description: "Longitude, decimal degrees"
      EorW:
        description: "E or W"
      FixQuality:
        description: "0 = invalid, 1 = GPS, 2 = DGPS, 4 = RTK fixed, 5 = RTK float"
      NumSats:
        description: "Number of satellites in use"
      HDOP:
        description: "Horizontal dilution of precision"
      AntennaHeight:
        units: "meters"
        description: "Antenna altitude above mean sea level"
      GeoidHeight:
        units: "meters"
        description: "Geoidal separation"
      LastDGPSUpdate:
        units: "seconds"
        description: "Age of differential correction"
      DGPSStationID:
        description: "Differential reference station id"
      Status:
        description: "A = valid, V = invalid"
      Mode:
        description: "Positioning mode indicator"
      NavStatus:
        description: "Navigational status (NMEA 4.1+)"
      SpeedKt:
        units: "knots"
        description: "Speed over ground"
      SpeedKm:
        units: "km/hour"
        description: "Speed over ground"
      CourseTrue:
        units: "degrees"
        description: "Course over ground, true"
      CourseMag:
        units: "degrees"
        description: "Course over ground, magnetic"
      MagVar:
        units: "degrees"
        description: "Magnetic variation"
      MagVarEorW:
        description: "Magnetic variation direction"
      HeadingTrue:
        units: "degrees"
        description: "True heading"
      LocalHours:
        description: "Local zone hours"
      LocalZone:
        description: "Local zone minutes"

  ##############################################################################
  # SPEED / DEPTH
  ##############################################################################

  # [NMEA] Doppler speed log. Two variants are seen on Sikuliaq: the full
  # 10-field VBW from 'speedlog', and a truncated 6-field form from
  # 'adcp_speedlog'. Both are listed; the parser tries each in turn.
  SKQ_Speedlog:
    category: "device_type"
    description: "Doppler speed log - NMEA VBW/DPT"
    format:
      VBW_full: "${:2l}VBW,{LongWaterSpeed:og},{TransWaterSpeed:og},{WaterSpeedStatus:ow},{LongGroundSpeed:og},{TransGroundSpeed:og},{GroundSpeedStatus:ow},{SternWaterSpeed:og},{SternWaterStatus:ow},{SternGroundSpeed:og},{SternGroundStatus:ow}*{Checksum:x}"
      VBW_short: "${:2l}VBW,{LongWaterSpeed:og},{TransWaterSpeed:og},{WaterSpeedStatus:ow},{LongGroundSpeed:og},{TransGroundSpeed:og},{GroundSpeedStatus:ow}*{Checksum:x}"
      DPT: "${:2l}DPT,{Depth:og},{TransducerOffset:og},{MaxRange:og}*{Checksum:x}"
    fields:
      LongWaterSpeed:
        units: "knots"
        description: "Longitudinal water speed, negative = astern"
      TransWaterSpeed:
        units: "knots"
        description: "Transverse water speed, negative = port"
      WaterSpeedStatus:
        description: "A = valid, V = invalid"
      LongGroundSpeed:
        units: "knots"
        description: "Longitudinal ground speed, negative = astern"
      TransGroundSpeed:
        units: "knots"
        description: "Transverse ground speed, negative = port"
      GroundSpeedStatus:
        description: "A = valid, V = invalid"
      SternWaterSpeed:
        units: "knots"
        description: "Stern transverse water speed"
      SternWaterStatus:
        description: "A = valid, V = invalid"
      SternGroundSpeed:
        units: "knots"
        description: "Stern transverse ground speed"
      SternGroundStatus:
        description: "A = valid, V = invalid"
      Depth:
        units: "meters"
        description: "Water depth relative to transducer"
      TransducerOffset:
        units: "meters"
        description: "Offset from transducer; positive = to waterline"
      MaxRange:
        units: "meters"
        description: "Maximum range scale in use"

  # [NMEA] Bridge echosounders. $SDDPT / $SDDBT
  SKQ_EchoSounder:
    category: "device_type"
    description: "Bridge echosounder - NMEA DPT/DBT"
    format:
      DPT: "${:2l}DPT,{Depth:og},{TransducerOffset:og},{MaxRange:og}*{Checksum:x}"
      DBT: "${:2l}DBT,{DepthFt:og},f,{DepthM:og},M,{DepthFath:og},F*{Checksum:x}"
    fields:
      Depth:
        units: "meters"
        description: "Depth relative to transducer"
      TransducerOffset:
        units: "meters"
        description: "Transducer offset"
      MaxRange:
        units: "meters"
        description: "Maximum range scale in use"
      DepthFt:
        units: "feet"
        description: "Depth below transducer"
      DepthM:
        units: "meters"
        description: "Depth below transducer"
      DepthFath:
        units: "fathoms"
        description: "Depth below transducer"

  # [NMEA] Kongsberg multibeam centerbeam depth. $EMDPT / $EMDBS
  SKQ_MB_Centerbeam:
    category: "device_type"
    description: "Kongsberg EM multibeam centerbeam depth"
    format:
      EMDPT: "$EMDPT,{Depth:og},{TransducerOffset:og},{MaxRange:og}*{Checksum:x}"
      EMDBS: "$EMDBS,{DepthFt:og},f,{DepthM:og},M,{DepthFath:og},F*{Checksum:x}"
    fields:
      Depth:
        units: "meters"
        description: "Centerbeam depth relative to transducer"
      TransducerOffset:
        units: "meters"
        description: "Transducer offset"
      MaxRange:
        units: "meters"
        description: "Maximum range scale in use"
      DepthFt:
        units: "feet"
        description: "Centerbeam depth"
      DepthM:
        units: "meters"
        description: "Centerbeam depth"
      DepthFath:
        units: "fathoms"
        description: "Centerbeam depth"

  # [NMEA] EK80 depth. $EKDBS
  SKQ_EK80Depth:
    category: "device_type"
    description: "Simrad EK80 depth"
    format:
      EKDBS: "$EKDBS,{DepthFt:og},f,{DepthM:og},M,{DepthFath:og},F*{Checksum:x}"
    fields:
      DepthFt:
        units: "feet"
        description: "Depth below transducer"
      DepthM:
        units: "meters"
        description: "Depth below transducer"
      DepthFath:
        units: "fathoms"
        description: "Depth below transducer"

  # [PROVISIONAL] WH300 centerboard transducer pressure/depth. $PMSG,5461*23
  # A single integer of unconfirmed scaling - it is NOT meters as-is.
  SKQ_XducerDepth:
    category: "device_type"
    description: "WH300 centerboard transducer depth sensor"
    format:
      PMSG: "$PMSG,{TransducerDepthRaw:d}*{Checksum:x}"
    fields:
      TransducerDepthRaw:
        description: "Raw transducer depth counts - scaling unconfirmed"

  ##############################################################################
  # THERMOSALINOGRAPH / WATER PROPERTIES
  ##############################################################################

  # [PROVISIONAL] Krohne flow meter.  0.579,6.14,28.65,0.52265
  SKQ_FlowKrohne:
    category: "device_type"
    description: "Krohne flow meter"
    format: "{FlowRate:og},{FlowVelocity:og},{FlowTemp:og},{FlowTotalizer:og}"
    fields:
      FlowRate:
        description: "Flow rate - units unconfirmed"
      FlowVelocity:
        description: "Flow velocity - units unconfirmed"
      FlowTemp:
        units: "deg C"
        description: "Fluid temperature - unconfirmed"
      FlowTotalizer:
        description: "Totalizer / accumulated volume - unconfirmed"

  # [PROVISIONAL] Total dissolved gas pressure.
  #   P 2026,08,23,22,14,29,19.25,1048.52,12.4
  SKQ_TDGP:
    category: "device_type"
    description: "Total dissolved gas pressure sensor"
    format: "P {Year:d},{Month:d},{Day:d},{Hour:d},{Minute:d},{Second:d},{TDGPTemp:og},{TDGPPressure:og},{TDGPVoltage:og}"
    fields:
      Year:
        description: "Sample year, sensor clock"
      Month:
        description: "Sample month, sensor clock"
      Day:
        description: "Sample day, sensor clock"
      Hour:
        description: "Sample hour, sensor clock"
      Minute:
        description: "Sample minute, sensor clock"
      Second:
        description: "Sample second, sensor clock"
      TDGPTemp:
        units: "deg C"
        description: "Temperature"
      TDGPPressure:
        units: "mbar"
        description: "Total dissolved gas pressure"
      TDGPVoltage:
        units: "volts"
        description: "Supply voltage - unconfirmed"

  # [PROVISIONAL] Pyrometer CT15.10 - "14.87 C"
  SKQ_Pyrometer_CT15:
    category: "device_type"
    description: "Optris CT15.10 infrared pyrometer"
    format: "{SurfaceTemp:g} {TempUnits:w}"
    fields:
      SurfaceTemp:
        units: "deg C"
        description: "Sea surface skin temperature"
      TempUnits:
        description: "Temperature units, normally C"

  ##############################################################################
  # OPTICS / RADIOMETRY
  ##############################################################################

  # [PROVISIONAL] Sea-Bird ECO Triplet fluorometer. The instrument emits its
  # own date and time, then wavelength/count pairs:
  #   08/23/26  22:10:59  650  213  695  121  460  87  518
  # The trailing value is the thermistor count.
  SKQ_FluoroTriplet:
    category: "device_type"
    description: "Sea-Bird ECO Triplet fluorometer"
    # The instrument's own date/time is broken into components rather than
    # captured whole: ':w' cannot match '08/23/26' because '/' is not a word
    # character. Two variants are listed - the wet-wall unit reports three
    # channels plus a thermistor, the CTD unit reports fewer.
    format:
      - "{SensorMonth:d}/{SensorDay:d}/{SensorYear:d}\t{SensorHour:d}:{SensorMinute:d}:{SensorSecond:d}\t{Wavelength1:d}\t{Value1:d}\t{Wavelength2:d}\t{Value2:d}\t{Wavelength3:d}\t{Value3:d}\t{Thermistor:d}"
      - "{SensorMonth:d}/{SensorDay:d}/{SensorYear:d}\t{SensorHour:d}:{SensorMinute:d}:{SensorSecond:d}\t{Wavelength1:d}\t{Value1:d}\t{Wavelength2:d}\t{Value2:d}"
    fields:
      SensorMonth:
        description: "Instrument clock month"
      SensorDay:
        description: "Instrument clock day"
      SensorYear:
        description: "Instrument clock year, two digit"
      SensorHour:
        description: "Instrument clock hour"
      SensorMinute:
        description: "Instrument clock minute"
      SensorSecond:
        description: "Instrument clock second"
      Wavelength1:
        units: "nm"
        description: "Channel 1 wavelength"
      Value1:
        description: "Channel 1 raw counts"
      Wavelength2:
        units: "nm"
        description: "Channel 2 wavelength"
      Value2:
        description: "Channel 2 raw counts"
      Wavelength3:
        units: "nm"
        description: "Channel 3 wavelength"
      Value3:
        description: "Channel 3 raw counts"
      Thermistor:
        description: "Thermistor raw counts"

  # [PROVISIONAL] Kipp & Zonen SGR4 pyrgeometer (downwelling longwave).
  #   611,133,-6.87,402.08,18.27,12.04,0,1,0
  SKQ_Pyrgeometer_SGR4:
    category: "device_type"
    description: "Kipp & Zonen SGR4 pyrgeometer"
    format: "{SerialNumber:d},{SampleCount:d},{NetRadiation:og},{LongwaveDown:og},{BodyTemp:og},{SupplyVoltage:og},{Status1:d},{Status2:d},{Status3:d}"
    fields:
      SerialNumber:
        description: "Instrument serial/model identifier"
      SampleCount:
        description: "Sample or sequence counter"
      NetRadiation:
        units: "W/m^2"
        description: "Net longwave radiation - unconfirmed"
      LongwaveDown:
        units: "W/m^2"
        description: "Downwelling longwave irradiance - unconfirmed"
      BodyTemp:
        units: "deg C"
        description: "Instrument body temperature"
      SupplyVoltage:
        units: "volts"
        description: "Supply voltage"
      Status1:
        description: "Status flag 1"
      Status2:
        description: "Status flag 2"
      Status3:
        description: "Status flag 3"

  # [PROVISIONAL] Kipp & Zonen SMP21 pyranometer (downwelling shortwave).
  #   605,195,177.8,18.0,12.0,1,1,0
  SKQ_Pyranometer_SMP21:
    category: "device_type"
    description: "Kipp & Zonen SMP21 pyranometer"
    format: "{SerialNumber:d},{SampleCount:d},{ShortwaveDown:og},{BodyTemp:og},{SupplyVoltage:og},{Status1:d},{Status2:d},{Status3:d}"
    fields:
      SerialNumber:
        description: "Instrument serial/model identifier"
      SampleCount:
        description: "Sample or sequence counter"
      ShortwaveDown:
        units: "W/m^2"
        description: "Downwelling shortwave irradiance"
      BodyTemp:
        units: "deg C"
        description: "Instrument body temperature"
      SupplyVoltage:
        units: "volts"
        description: "Supply voltage"
      Status1:
        description: "Status flag 1"
      Status2:
        description: "Status flag 2"
      Status3:
        description: "Status flag 3"

  # [PROVISIONAL] Biospherical QSR-2150A PAR sensor.
  #   866.876, 12.74, 7.494
  SKQ_PAR_QSR2150A:
    category: "device_type"
    description: "Biospherical QSR-2150A PAR sensor"
    format: "{PAR:og},{SupplyVoltage:og},{SensorVoltage:og}"
    fields:
      PAR:
        units: "uE/m^2/s"
        description: "Photosynthetically active radiation"
      SupplyVoltage:
        units: "volts"
        description: "Supply voltage"
      SensorVoltage:
        units: "volts"
        description: "Sensor output voltage - unconfirmed"

  ##############################################################################
  # CHEMISTRY
  ##############################################################################

  # [PROVISIONAL] Sea-Bird SUNA nitrate sensor, SATSLF frame.
  SKQ_Nitrate_SUNA:
    category: "device_type"
    description: "Sea-Bird SUNA V2 nitrate sensor"
    format: "SATSLF{SerialNumber:d},{SampleDate:d},{SampleTime:og},{Nitrate:og},{NitrogenMg:og},{Absorbance254:og},{Absorbance350:og},{Bromide:og},{SpectrumAvg:od}"
    fields:
      SerialNumber:
        description: "Instrument serial number"
      SampleDate:
        description: "Sample date as YYYYDDD (year and day-of-year)"
      SampleTime:
        units: "hours"
