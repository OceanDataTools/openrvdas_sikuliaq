     wind_mast_port-net, wind_mast_port_true-net, wind_mast_stbd-net, wind_mast_stbd_true-net,
     wind_metek_fwdmast-net,
     # tsg_emssv-net, wave_wamos-net,
     parse_data-on
    ]

  write:
