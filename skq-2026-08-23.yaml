     oxygen_optode4330-net, oxygen_optode4330_cor-net, pco2_ldeo_merge-net, rad_qsr2150a-net,
     rad_sgr4-net, rad_smp21-net, rain_org815ds-net, sb_echosounder_1-net, sb_echosounder_2-net,
     speedlog-net, ssv_aml_cb-net, tdgp-net, thermo_pyrometer_ct15-net, thermo_sbe38_cb-net,
     thermo_sbe38_fwd-net, tsg_sbe45_fwd-net, tsg_sbe45_fwd_2-net,
