  #wave_wamos	NMEA output from WAMOS	none	none
  #tsg_emssv	Calculated SSV for EM304,710	none	none

  # Parse raw UDP data and send to CDS, and optionally InfluxDB;
  # uses default global variables
  parse_data:
    logger_template: skq_parse_data_logger_template

###########################################################
modes:
  'off':  # without a 'default_mode' key, first defined mode will be default
    [adcp_speedlog-off, ais_bridge-off, ctd_sea_bird-off, ek80_depth-off, flow_krohne_fwd-off, flow_krohne_pco2-off,
     fluoro_triplet_ctd-off, fluoro_triplet_ctd_mrg-off, fluoro_triplet_fwd-off, gnss_cnav-off,
