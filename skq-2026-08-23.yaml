###########################################################
###########################################################
# YAML cruise definition file for OpenRVDAS.
#
# Created by:
#   command:  <<command_line>>
#   time:     <<date_time>>  UTC
#   user:     <<user>>
#
###########################################################
cruise:
  id: <<cruise>>
  start: '<<cruise_start>>'
  end: '<<cruise_end>>'

###########################################################
includes:
  - contrib/logger_templates/udp_logger_template.yaml
  - local/sikuliaq/logger_templates/skq_parse_data_logger_template.yaml
  - contrib/logger_templates/true_winds_logger_template.yaml
  - contrib/logger_templates/snapshot_logger_template.yaml

###########################################################
# Global variables - can be overridden by individual loggers
variables:
  cruise: SKQ2026-07T
  cruise_start: '2026-08-19'
  cruise_end: '2026-08-30'

  udp_destination: 255.255.255.255
  raw_udp_port: 55150
  parsed_udp_port: 55151

  file_root: /var/tmp/log
  parse_definition_path: local/sikuliaq/devices/skq_devices.yaml

  data_server: localhost:55152
  influx_bucket_name: openrvdas

  user: rvdas

###########################################################
loggers:
  adcp_speedlog:
    logger_template: udp_logger_template
    variables:
      reader_udp_port: 53135
  ais_bridge:
    logger_template: udp_logger_template
    variables:
      reader_udp_port: 53134
